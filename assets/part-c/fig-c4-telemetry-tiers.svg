<text x="276" y="104" font-family="Inter, sans-serif" font-size="18" font-weight="800" fill="#131c30" text-anchor="start" letter-spacing="2.5">DECISIONS</text>
<text x="276" y="132" font-family="Inter, sans-serif" font-size="18" fill="#3a4152" text-anchor="start">per iteration</text>
