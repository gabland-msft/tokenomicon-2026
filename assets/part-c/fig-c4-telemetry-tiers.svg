<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 400" width="1080" height="400" role="img" aria-labelledby="fig-c4-telemetry-tiers-title fig-c4-telemetry-tiers-desc">
<title id="fig-c4-telemetry-tiers-title">Telemetry in nested tiers</title>
<desc id="fig-c4-telemetry-tiers-desc">Four nested telemetry tiers. Innermost and always available: billing by account, enough for price risk only. Around it: usage per call, then decisions per iteration. Outermost, drawn dashed because it arrives late and is only partly observable: outcomes per task.</desc>
<defs>
<marker id="fig-c4-telemetry-tiers-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
<marker id="fig-c4-telemetry-tiers-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b96a8"/></marker>
