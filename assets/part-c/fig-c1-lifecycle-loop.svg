<title id="fig-c1-lifecycle-loop-title">Plan, manage, optimize, review</title>
<desc id="fig-c1-lifecycle-loop-desc">A closed loop with four stations in order: Plan (set expectations), Manage (attribute spend), Optimize (change one thing), Review (scale, sustain, stop), then back to Plan. Token yield is measured at every station.</desc>
