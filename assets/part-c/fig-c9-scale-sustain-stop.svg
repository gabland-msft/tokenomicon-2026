<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 236" width="1040" height="236" role="img" aria-labelledby="fig-c9-scale-sustain-stop-title fig-c9-scale-sustain-stop-desc">
<title id="fig-c9-scale-sustain-stop-title">Scale, sustain or stop</title>
<desc id="fig-c9-scale-sustain-stop-desc">Three review decisions side by side, judged on yield against the plan. Scale: at or above plan, holding steady. Sustain: above the floor but below plan. Stop: below the floor after the agreed attempts.</desc>
