<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" role="img" aria-labelledby="fig-c2-baseline-card-title fig-c2-baseline-card-desc">
<title id="fig-c2-baseline-card-title">A baseline card</title>
<desc id="fig-c2-baseline-card-desc">A baseline card for one task class, written before spend: the value hypothesis, cost per task with price assumptions stated, expected yield as finished, kept and mattered (illustrative 0.9, 0.8, 0.7), a stop condition (yield below 0.4 for four weeks, illustrative), and one named owner.</desc>
