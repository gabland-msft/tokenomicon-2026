<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 970 452" width="970" height="452" role="img" aria-labelledby="fig-c7-lever-ladder-title fig-c7-lever-ladder-desc">
<title id="fig-c7-lever-ladder-title">A ladder of levers</title>
<desc id="fig-c7-lever-ladder-desc">Six optimisation levers ordered by proposed effect on yield, top to bottom: stop what does not convert, fix the agent loop, cache the stable prefix, route by task class, batch what can wait, quotas and rates. The top acts on yield risk, the bottom on price risk. Order illustrative.</desc>
<defs>
<marker id="fig-c7-lever-ladder-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#4a7fb5"/></marker>
<marker id="fig-c7-lever-ladder-arrow-m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b96a8"/></marker>
</defs>
