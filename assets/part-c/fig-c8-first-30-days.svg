<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-labelledby="fig-c8-first-30-days-title fig-c8-first-30-days-desc">
<title id="fig-c8-first-30-days-title">The first 30 days</title>
<desc id="fig-c8-first-30-days-desc">Four weeks in sequence. Week 1: tag every call and write baseline cards. Week 2: find the lowest yield per dollar. Week 3: pull one lever on that class. Week 4: compare to the baseline card and write the result down.</desc>
